###########################
###  Configuration
###########################

# Set Zsh as your default Tmux shell
set-option -g default-shell /bin/zsh

# Use 256 term for pretty colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Increase scroll-back history
set -g history-limit 5000

# Use vim key bindings
setw -g mode-keys vi

# Increase repeat time for repeatable commands
set -g repeat-time 1000

# Enable mouse interaction
setw -g mouse on

# Set focus events
set-option -g focus-events on

# Set clipboard on
set -s set-clipboard on

# Emit OSC 52 regardless of the client's TERM. tmux only sends the clipboard
# escape when terminal-features says the terminal supports it, and the built-in
# list only covers xterm*. Alacritty sending TERM=alacritty would silently stop
# all copy-to-local-clipboard with no error.
set -as terminal-features ',*:clipboard'

# Set the numbering of windows to go from 1 instead of 0 - silly programmers :|
set-option -g base-index 1
set-window-option -g pane-base-index 1
setw -g pane-base-index 1

# Lower escape timing from 500ms to 50ms for quicker response to scroll-buffer access.
# Basically allows for faster key repetition.
set -s escape-time 0

# Rather than constraining window size to the maximum size of any client 
# connected to the *session*, constrain window size to the maximum size of any 
# client connected to *that window*. 
setw -g aggressive-resize on

# Automatically set window titles so you know what's going on.
set-window-option -g automatic-rename on
set-option -g set-titles on

# Theme
set -g status-interval 5 
set -g status 'on'
set -g status-bg 'default'
set -g status-justify 'centre'
set -g status-left-length '100'
set -g status-right-length '100'
set -g message-style bg='colour238'
set -g message-style fg='colour222'
set -g message-command-style bg='colour238'
set -g message-command-style fg='colour222'
set -g status-right-style 'none'
set -g status-style 'none'
set -g status-left-style 'none'
set -g status-left '#[fg=colour232,bg=colour154] #S #[fg=colour154,bg=colour238,nobold,nounderscore,noitalics]#[fg=colour222,bg=colour238] #W #[fg=colour238,bg=colour235,nobold,nounderscore,noitalics]#[fg=colour121,bg=colour235] #(whoami)  #(uptime | sed "s/.*\(up.*days\).*/\1/") #[fg=colour235,bg=colour235,nobold,nounderscore,noitalics]'
set -g status-right '#[fg=colour235,bg=colour235,nobold,nounderscore,noitalics]#[fg=colour121,bg=colour235] %r  %a  %m-%d-%Y #[fg=colour238,bg=colour235,nobold,nounderscore,noitalics]#[fg=colour222,bg=colour238] #H '
# set -g window-active-style 'fg=default,bg=colour235'

setw -g window-status-style 'none'
setw -g window-status-style fg='colour121'
setw -g window-status-style bg='colour235'
setw -g window-status-activity-style 'none'
setw -g window-status-activity-style bg='colour235' 
setw -g window-status-activity-style fg='colour154'
setw -g window-status-separator ''
setw -g window-status-format '#[fg=colour235,bg=colour235,nobold,nounderscore,noitalics]#[default] #I  #W #[fg=colour2k35,bg=colour235,nobold,nounderscore,noitalics]'
setw -g window-status-current-format '#[fg=colour235,bg=colour238,nobold,nounderscore,noitalics]#[fg=colour222,bg=colour238] #I  #W  #F #[fg=colour238,bg=colour235,nobold,nounderscore,noitalics]'

# Color Themes
set -g @plugin "arcticicestudio/nord-tmux"

# Other useful Tmux plugins
# NOTE: tmux-copycat retired 2026-07-31. tmux 3.1+ has its native equivalents
# built in (/ and ? searching, #{copy_cursor_word} for * and #). Copycat only
# wrapped the stock copy bindings in run-shell to append a mode-quit hook.
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-ressurect and tmux-continuum config
# tmux-resurrect will now restore vim and neovim sessions if Session.vim file is present
## Restore vim sessions
set -g @resurrect-strategy-vim 'session'
## Restore neovim sessions
set -g @resurrect-strategy-nvim 'session'
## Restore panes
# set -g @resurrect-capture-pane-contents 'on'
## Restore last saved environment (automatically)
set -g @continuum-restore 'on'
# Start tmux automatically on boot
set -g @continuum-boot 'on'
# Restore additional programs
set -g @resurrect-processes 'ssh psql mysql sqlite3'

# Tmux Plugin Manager (https://github.com/tmux-plugins/tpm)
run "~/.tmux/plugins/tpm/tpm"

###########################
###  Key Bindings
###########################

# Remap prefix 
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Intuitive symbols to split the screen
bind | split-window -h
bind - split-window -v

# Switch panes
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shortcut to source the .tmux.conf file
bind R source-file ~/.tmux.conf \; display "~/.tmux.conf reloaded"

###########################
###  Copy Mode
###########################

# vi-style yank. Not a tmux default, despite mode-keys vi.
# copy-pipe-and-cancel with no command copies to the tmux buffer and, because
# set-clipboard is on, emits OSC 52 so the text lands on the LOCAL clipboard.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Restore the stock bindings tmux-copycat hijacked. Dropping the plugin from the
# @plugin list is not enough: bindings live in the running server, and
# source-file does not reset them, so without these the retired plugin's
# run-shell wrappers survive until the server is killed.
bind-key -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi C-c               send-keys -X cancel
bind-key -T copy-mode-vi q                 send-keys -X cancel
bind-key -T copy-mode-vi A                 send-keys -X append-selection-and-cancel
bind-key -T copy-mode-vi D                 send-keys -X copy-pipe-end-of-line-and-cancel
bind-key -T copy-mode-vi n                 send-keys -X search-again
bind-key -T copy-mode-vi N                 send-keys -X search-reverse
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi DoubleClick1Pane  select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi TripleClick1Pane  select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel
